<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN Lite</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1d2433;--mu:#6b7385;--bd:#e3e7ef;--pr:#2563eb;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--side:#111827;--sidetx:#cbd5e1}
[data-theme=dark]{--bg:#0f1420;--card:#171d2c;--tx:#e6e9f2;--mu:#8b94a8;--bd:#262e42;--pr:#3b82f6;--side:#0a0e17}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}.side{width:210px;background:var(--side);color:var(--sidetx);padding:14px 0;flex:none}
.side h1{font-size:17px;margin:0 16px 14px;color:#fff}.side a{display:block;padding:10px 18px;color:var(--sidetx);cursor:pointer;border-inline-start:3px solid transparent}
.side a.on,.side a:hover{background:rgba(255,255,255,.07);color:#fff;border-inline-start-color:var(--pr)}
.main{flex:1;min-width:0;padding:18px}.top{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.top h2{margin:0;flex:1;font-size:19px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mu);font-size:12px}
.btn{border:1px solid var(--bd);background:var(--card);padding:6px 12px;border-radius:7px;cursor:pointer}.btn:hover{border-color:var(--pr)}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}.btn.d{color:var(--er)}.btn.s{padding:3px 8px;font-size:12px}
input,select,textarea{border:1px solid var(--bd);background:var(--card);padding:6px 9px;border-radius:7px;max-width:100%}
table{width:100%;border-collapse:collapse}th,td{padding:8px 9px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}tr:hover td{background:rgba(127,127,127,.06)}.sc{overflow-x:auto}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff;background:var(--mu)}.pill.active{background:var(--ok)}.pill.expired,.pill.depleted{background:var(--er)}.pill.disabled{background:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:4px;min-width:90px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}.bar.hi i{background:var(--er)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(127,127,127,.15);font-size:12px;margin-inline-end:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:9}
.modal .card{width:min(560px,100%)}.row{display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.row label{width:120px;color:var(--mu);font-size:13px}
.row input,.row select{flex:1;min-width:120px}.row input[type=checkbox]{flex:none;min-width:0;width:auto}.bar-sel{background:var(--pr);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;inset-inline-end:18px;background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:20}.toast.er{background:var(--er)}
.login{max-width:340px;margin:12vh auto}.login input{width:100%;margin-bottom:10px}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px}.mu{color:var(--mu)}
@media(max-width:760px){.side{display:none}.mob{display:flex!important}.main{padding:10px}}
.mob{display:none;gap:6px;overflow:auto;margin-bottom:10px}.mob a{padding:6px 12px;border:1px solid var(--bd);border-radius:7px;white-space:nowrap;background:var(--card)}.mob a.on{border-color:var(--pr);color:var(--pr)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
pre{background:rgba(127,127,127,.12);padding:10px;border-radius:8px;overflow:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div id="root"></div>

let lang = localStorage.getItem("lang") || "fa", theme = localStorage.getItem("theme") || "light";

applyLook();

function h(tag, attrs, ...kids){const e=document.createElement(tag);

  if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else if(k==="checked")e.checked=!!v;else e.setAttribute(k,v===true?"":v)}

const $root = document.getElementById("root");

async function api(path,opt){opt=opt||{};const r=await fetch(BASE+path.replace(/^\//,""),{credentials:"same-origin",...opt});
 if(r.status===401||r.status===404){showLogin();throw new Error("auth")}
 const ct=r.headers.get("content-type")||"";if(!ct.includes("json"))return r;const j=await r.json();return j}

const post=(p,body)=>call(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
const form=(p,o)=>api(p,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(o).toString()});
function fmtB(n){n=+n||0;const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return (n>=100||i===0?n.toFixed(0):n.toFixed(1))+" "+u[i]}
function fmtExp(ms){if(!ms)return t("unl");const d=(ms-Date.now())/864e5;return d<0?t("expired"):(d<1?Math.max(1,Math.round(d*24))+"h ":Math.ceil(d)+"d ")+t("left")}
function ago(ms){if(!ms)return t("never");const s=(Date.now()-ms)/1000;return s<90?Math.round(s)+"s":s<5400?Math.round(s/60)+"m":s<172800?Math.round(s/3600)+"h":Math.round(s/86400)+"d"}
function fmtDate(ms){return new Date(ms).toLocaleString()}

let page="dash",timer=null,inboundsCache=[];

  const j=await r.json();if(j.success)boot();else toast(j.msg,1)};

 $root.replaceChildren(h("div",{class:"login card"},h("h2",{},"VPN Lite"),u,p,h("button",{class:"btn p",style:"width:100%",onclick:go},t("login"))))}

const PAGES=["dash","accounts","inbounds","online","logs","settings"];

  h("a",{onclick:()=>{lang=lang==="fa"?"en":"fa";localStorage.setItem("lang",lang);applyLook();render()}},t("lang")),

  h("div",{class:"main"},h("div",{class:"mob"},PAGES.map(k=>h("a",{class:k===page?"on":"",onclick:()=>{page=k;render()}},t(k)))),content))}

function auto(fn,ms){clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)fn().catch(()=>{})},ms)}

/* ---------- dashboard ---------- */
async function pDash(c){

  const stat=(v,l)=>h("div",{class:"card stat"},h("b",{class:"num"},v),h("span",{},l));
  c.replaceChildren(h("div",{class:"top"},h("h2",{},t("dash"))),

   h("div",{class:"card sc"},h("table",{},h("tr",{},["remark","proto","port","members","online"].map(k=>h("th",{},t(k==="online"?"online":k)))),
    s.inbounds.map(i=>h("tr",{},h("td",{},i.remark||("#"+i.id)),h("td",{},h("span",{class:"tag"},i.protocol)),h("td",{},i.port),h("td",{},i.members),h("td",{},i.online))))))};

/* ---------- accounts ---------- */
const AS={q:"",status:"",inbound:"",sort:"name",page:1,size:50,sel:new Set()};

  h("div",{class:"row"},q,sel([["",t("all")],["active",t("active")],["expired",t("expired")],["depleted",t("depleted")],["disabled",t("disabled")],["online",t("online")]],"status"),

   r.items.map(a=>{const pct=a.total?Math.min(100,(a.up+a.down)*100/a.total):0;
    return h("tr",{},h("td",{},h("input",{type:"checkbox",checked:AS.sel.has(a.email),onchange:e=>{e.target.checked?AS.sel.add(a.email):AS.sel.delete(a.email);drawBulk()}})),
     h("td",{},h("b",{},a.email),a.comment?h("div",{class:"mu"},a.comment):null),
     h("td",{},a.inbounds.map(i=>h("span",{class:"tag"},names[i]||i)),a.singleProto&&a.inbounds.length>1?h("span",{class:"tag",title:t("single")},"①"):null),
     h("td",{},h("div",{class:"num"},fmtB(a.up+a.down)+" / "+(a.total?fmtB(a.total):t("unl"))),a.total?h("div",{class:"bar"+(pct>90?" hi":"")},h("i",{style:"width:"+pct+"%"})):null),

   })):h("div",{class:"mu"},t("none"))),
   h("div",{class:"pg"},h("span",{class:"mu"},r.total+" "+t("accounts")),h("button",{class:"btn s",disabled:AS.page<=1,onclick:()=>{AS.page--;load()}},"‹"),
    h("span",{},t("page")+" "+AS.page+" "+t("of")+" "+pages),h("button",{class:"btn s",disabled:AS.page>=pages,onclick:()=>{AS.page++;load()}},"›")));drawBulk()}
 function drawBulk(){if(!AS.sel.size){bulk.replaceChildren();return}
  const act=async(a,extra)=>{if(a==="delete"&&!confirm(t("confirm")))return;await post("panel/ui/bulk",{action:a,emails:[...AS.sel],...extra});toast(t("saved"));AS.sel.clear();load()};
  const days=h("input",{type:"number",value:30,style:"width:70px"}),gb=h("input",{type:"number",value:0,style:"width:70px"});
  bulk.replaceChildren(h("div",{class:"bar-sel"},AS.sel.size+" "+t("sel"),h("button",{class:"btn s",onclick:()=>act("enable")},t("enable")),h("button",{class:"btn s",onclick:()=>act("disable")},t("disable")),
   h("button",{class:"btn s",onclick:()=>act("reset")},t("reset")),days,"d",gb,"GB",h("button",{class:"btn s",onclick:()=>act("extend",{days:+days.value,gb:+gb.value})},t("extend")),

function modal(title,content,actions){const m=h("div",{class:"modal",onclick:e=>e.target===m&&m.remove()},h("div",{class:"card"},h("h3",{style:"margin-top:0"},title),content,h("div",{class:"row",style:"margin:14px 0 0;justify-content:flex-end"},actions)));document.body.append(m);return m}
const field=(l,el)=>h("div",{class:"row"},h("label",{},l),el);
function accountModal(a){const isNew=!a;a=a||{email:"",username:"",password:randpw(),enable:true,total:0,expiry:0,limitIp:0,speedDown:0,speedUp:0,reset:0,comment:"",inbounds:[],subId:"",singleProto:true};
 const f={email:h("input",{value:a.email,disabled:!isNew}),pass:h("input",{value:a.password}),gb:h("input",{type:"number",step:"any",value:a.total?+(a.total/1073741824).toFixed(3):0}),
