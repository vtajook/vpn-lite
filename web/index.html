<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN Lite</title>
<style>
:root{--bg:#eef1fb;--card:#fff;--tx:#1b2140;--mu:#6a7394;--bd:#e2e6f5;--pr:#6366f1;--pr2:#8b5cf6;--ok:#10b981;--wa:#f59e0b;--er:#ef4444;--cy:#06b6d4;--pk:#ec4899;--side1:#1e1b4b;--side2:#312e81;--sidetx:#c7d2fe;--sh:0 4px 18px rgba(79,70,229,.08)}
[data-theme=dark]{--bg:#0e1020;--card:#171a31;--tx:#e8eaf8;--mu:#8e96bd;--bd:#262b4d;--pr:#818cf8;--pr2:#a78bfa;--side1:#0a0b1a;--side2:#16183a;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}.side{width:224px;background:linear-gradient(180deg,var(--side1),var(--side2));color:var(--sidetx);padding:18px 10px;flex:none;position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:19px;margin:2px 10px 18px;color:#fff;display:flex;align-items:center;gap:9px}.side h1 i{font-style:normal;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pr),var(--pk));display:grid;place-items:center;font-size:17px}
.side a{display:flex;gap:11px;align-items:center;padding:10px 12px;margin-bottom:3px;color:var(--sidetx);cursor:pointer;border-radius:10px;transition:.15s}
.side a b{width:22px;text-align:center;font-weight:400;font-size:16px}
.side a:hover{background:rgba(255,255,255,.08);color:#fff}.side a.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.45)}
.side hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:10px 4px}
.main{flex:1;min-width:0;padding:22px 26px}.top{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.top h2{margin:0;flex:1;font-size:21px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.dg{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-bottom:14px}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:#94a3b8;position:relative;cursor:pointer;transition:background .15s;border:0;flex:none;vertical-align:middle}.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw:checked{background:#10b981}.sw:checked:after{inset-inline-start:21px}
.ops{white-space:nowrap}.ib{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:44px;padding:3px 4px;margin:0 1px;background:none;border:1px solid transparent;border-radius:8px;color:inherit;cursor:pointer}.ib:hover{background:rgba(99,102,241,.1);border-color:var(--bd,rgba(99,102,241,.3))}.ib .ic{font-size:16px;line-height:1.2}.ib .lb{font-size:10px;color:var(--mu)}.ib.d .lb,.ib.d{color:var(--er)}
.lk{cursor:pointer;transition:transform .12s}.lk:hover{transform:translateY(-2px)}.dc{padding:12px;margin:0;min-width:0}.dh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.di{font-size:18px}.dl{font-size:12px;color:var(--mu);flex:1}
.dv{font-size:20px;font-weight:700;color:var(--c)}.dm{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.d2{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:6px;gap:4px;flex-wrap:wrap}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin-bottom:14px}
.stat{position:relative;overflow:hidden;padding-inline-start:20px}.stat:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--c,var(--pr))}
.stat b{display:block;font-size:25px;margin-top:22px;text-align:start;color:var(--c,var(--pr))}.stat span{color:var(--mu);font-size:12.5px}.stat em{position:absolute;inset-inline-end:12px;top:8px;font-style:normal;font-size:22px;opacity:.9}
.btn{border:1px solid var(--bd);background:var(--card);padding:7px 14px;border-radius:9px;cursor:pointer;transition:.15s}.btn:hover{border-color:var(--pr);color:var(--pr)}
.btn.p{background:linear-gradient(135deg,var(--pr),var(--pr2));border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(99,102,241,.35)}.btn.p:hover{color:#fff;filter:brightness(1.08)}
.btn.d{color:var(--er)}.btn.d:hover{border-color:var(--er);color:var(--er)}.btn.s{padding:3px 9px;font-size:12px}
input,select,textarea{border:1px solid var(--bd);background:var(--card);padding:7px 10px;border-radius:9px;max-width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
table{width:100%;border-collapse:collapse}th,td{padding:10px 10px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600;background:rgba(99,102,241,.05)}tr:hover td{background:rgba(99,102,241,.06)}.sc{overflow-x:auto}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;color:#fff;background:var(--mu)}.pill.active{background:var(--ok)}.pill.expired,.pill.depleted{background:var(--er)}.pill.disabled{background:var(--mu)}
.bar{height:7px;background:var(--bd);border-radius:5px;min-width:90px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pr))}.bar.hi i{background:linear-gradient(90deg,var(--wa),var(--er))}
.tag{display:inline-block;padding:1px 9px;border-radius:7px;background:rgba(99,102,241,.14);color:var(--pr);font-size:12px;margin-inline-end:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:5px;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.modal{position:fixed;inset:0;background:rgba(15,15,40,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:9}
.modal .card{width:min(580px,100%)}.row{display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.row label{width:130px;color:var(--mu);font-size:13px}
.row input,.row select{flex:1;min-width:120px}.row input[type=checkbox]{flex:none;min-width:0;width:auto}.bar-sel{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:9px 14px;border-radius:11px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;inset-inline-end:18px;background:#1e1b4b;color:#fff;padding:11px 18px;border-radius:11px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)}.toast.er{background:var(--er)}
body.lg{background:radial-gradient(circle at 20% 15%,#6366f1 0,transparent 45%),radial-gradient(circle at 85% 85%,#ec4899 0,transparent 45%),#1e1b4b}
.login{max-width:350px;margin:13vh auto;padding:28px;text-align:center}.login input{width:100%;margin-bottom:12px}.login h2{margin:0 0 4px}.login .lo{font-size:38px}.login p{margin:0 0 18px;color:var(--mu)}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px}.mu{color:var(--mu)}
@media(max-width:760px){.side{display:none}.mob{display:flex!important}.main{padding:12px}}
.mob{display:none;gap:6px;overflow:auto;margin-bottom:12px}.mob a{padding:7px 14px;border:1px solid var(--bd);border-radius:10px;white-space:nowrap;background:var(--card)}.mob a.on{background:linear-gradient(135deg,var(--pr),var(--pr2));border-color:transparent;color:#fff}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
pre{background:rgba(99,102,241,.08);padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-all;border:1px dashed var(--bd)}
</style>
